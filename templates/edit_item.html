<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Food Item</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="dashboard-container">

    <!-- Header -->

    <header class="dashboard-header">

        <div>

            <h1>✏️ Edit Food Item</h1>

            <p>Update your menu item</p>

        </div>

        <a href="/dashboard" class="view-menu">
            ← Back to Dashboard
        </a>

    </header>


    <!-- Edit Form -->

    <section class="dashboard-card">

        <h2>Update Food</h2>


        <form method="POST"
              enctype="multipart/form-data">


            <!-- Food Name -->

            <label>Food Name</label>

            <input
                type="text"
                name="name"
                value="{{ food['name'] }}"
                required
            >


            <!-- Category -->

            <label>Category</label>

            <input
                type="text"
                name="category"
                value="{{ food['category'] }}"
                required
            >


            <!-- Description -->

            <label>Description</label>

            <textarea
                name="description"
                rows="4"
            >{{ food['description'] }}</textarea>


            <!-- Price -->

            <label>Price (₹)</label>

            <input
                type="number"
                name="price"
                value="{{ food['price'] }}"
                min="0"
                step="0.01"
                required
            >


            <!-- Current Image -->

            {% if food['image'] %}

            <label>Current Image</label>

            <img
                src="{{ url_for(
                    'static',
                    filename='images/' + food['image']
                ) }}"
                alt="{{ food['name'] }}"
                style="
                    width: 150px;
                    height: 150px;
                    object-fit: cover;
                    border-radius: 12px;
                    margin-bottom: 15px;
                "
            >

            {% endif %}


            <!-- New Image -->

            <label>Change Image</label>

            <input
                type="file"
                name="image"
                accept="image/*"
            >


            <!-- Save -->

            <button
                type="submit"
                class="add-button">

                💾 Update Food

            </button>


        </form>

    </section>

</div>

</body>

</html>
