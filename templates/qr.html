<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Menu QR Code
    </title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f6fa;
            color: #222;
        }

        .container {
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
        }

        .box {
            background: white;
            padding: 30px;
            border-radius: 14px;
            text-align: center;

            box-shadow:
                0 2px 12px
                rgba(0,0,0,0.08);
        }

        h1 {
            margin-top: 0;
        }

        .qr-image {
            width: 300px;
            max-width: 100%;
            margin: 20px auto;
            display: block;
        }

        .url-box {
            background: #f1f5f9;
            padding: 12px;
            border-radius: 8px;

            word-break: break-all;

            margin-top: 15px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 22px;
        }

        .button {
            display: inline-block;

            padding: 11px 16px;

            border-radius: 7px;

            text-decoration: none;

            color: white;
        }

        .dashboard {
            background: #374151;
        }

        .menu {
            background: #2563eb;
        }

        .print {
            background: #16a34a;
            border: none;
            cursor: pointer;
            font-size: 15px;
        }

        @media print {

            body {
                background: white;
            }

            .buttons,
            .url-box {
                display: none;
            }

            .box {
                box-shadow: none;
            }

        }

    </style>

</head>

<body>


<div class="container">

    <div class="box">

        <h1>
            📱 Menu QR Code
        </h1>

        <p>
            Customer is QR code ko scan karke
            hotel ka menu open kar sakta hai.
        </p>


        <!-- QR IMAGE -->

        <img
            src="{{ url_for(
                'qr_image',
                filename=qr_filename
            ) }}"
            class="qr-image"
            alt="Menu QR Code"
        >


        <!-- MENU URL -->

        <div class="url-box">

            <strong>
                Menu Link:
            </strong>

            <br><br>

            {{ menu_url }}

        </div>


        <!-- BUTTONS -->

        <div class="buttons">

            <a
                href="{{ url_for('dashboard') }}"
                class="button dashboard"
            >
                ← Dashboard
            </a>


            <a
                href="{{ menu_url }}"
                target="_blank"
                class="button menu"
            >
                👁️ Open Menu
            </a>


            <button
                onclick="window.print()"
                class="button print"
            >
                🖨️ Print QR
            </button>

        </div>

    </div>

</div>


</body>

</html>
