<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 6px 0 15px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 13px;
            background: #dc2626;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
        }
        .error {
            color: #dc2626;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🔐 Change Admin Password</h1>
    {% if user["hotel_name"] %}
        <p>
            Hotel:
            <strong>{{ user["hotel_name"] }}</strong>
        </p>
    {% endif %}
    <p>
        Username:
        <strong>{{ user["username"] }}</strong>
    </p>
    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}
    <form method="POST">
        <label>New Password</label>
        <input
            type="password"
            name="new_password"
            required
            minlength="4"
        >
        <label>Confirm New Password</label>
        <input
            type="password"
            name="confirm_password"
            required
            minlength="4"
        >
        <button type="submit">
            🔐 Update Password
        </button>
    </form>
    <br>
    <a href="{{ url_for('super_admin') }}">
        ← Back to Super Admin
    </a>
</div>
</body>
</html>
