<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Hotel</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f6fa;
        }
        .container {
            max-width: 700px;
            margin: 40px auto;
            padding: 20px;
        }
        .box {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }
        h1 {
            margin-top: 0;
        }
        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 6px;
            font-weight: bold;
        }
        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 15px;
        }
        .logo {
            width: 100px;
            height: 100px;
            object-fit: contain;
            margin: 10px 0;
            border-radius: 10px;
        }
        .btn {
            margin-top: 25px;
            padding: 12px 20px;
            border: none;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }
        .back {
            display: inline-block;
            margin-left: 10px;
            padding: 12px 20px;
            background: #6b7280;
            color: white;
            text-decoration: none;
            border-radius: 7px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="box">
        <h1>Edit Hotel</h1>
        <form method="POST"
              enctype="multipart/form-data">
            <label>Hotel Name</label>
            <input
                type="text"
                name="name"
                value="{{ hotel.name or '' }}"
                required>
            <label>Address</label>
            <input
                type="text"
                name="address"
                value="{{ hotel.address or '' }}">
            <label>Phone</label>
            <input
                type="text"
                name="phone"
                value="{{ hotel.phone or '' }}">
            <label>Email</label>
            <input
                type="email"
                name="email"
                value="{{ hotel.email or '' }}">
            <label>Hotel Logo</label>
            {% if hotel.logo %}
                <div>
                    <img
                        src="{{ url_for('static', filename=hotel.logo) }}"
                        class="logo"
                        alt="Hotel Logo">
                </div>
            {% endif %}
            <input
                type="file"
                name="logo"
                accept="image/*">
            <div>
                <button
                    type="submit"
                    class="btn">
                    Save Changes
                </button>
                <a
                    href="{{ url_for('super_admin') }}"
                    class="back">
                    Back
                </a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
